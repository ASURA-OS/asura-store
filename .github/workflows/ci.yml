name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Go backend
        run: |
          cd cmd/asura-store
          go build -v ./...

      - name: Run Go Unit Tests
        run: |
          cd cmd/asura-store
          go test -v ./...

      - name: Run Node UI Tests
        run: |
          cd ui/lib
          node --test store.test.mjs
